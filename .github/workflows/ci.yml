name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: t20
          POSTGRES_DB: t20
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t20 -d t20"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      T20_TEST_DATABASE_URL: postgresql+psycopg://t20@127.0.0.1:5432/t20
      T20_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_DATABASE_URL: postgresql://t20@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .
          
      - name: Type check with mypy
        run: |
          mypy .

      - name: Architecture import contracts
        run: |
          lint-imports

      - name: Published OpenAPI is current
        run: python -m scripts.export_openapi --check

      # Run twice: the first call builds the schema from an empty database,
      # proving the migration chain is reproducible from clean; the second proves
      # it is a no-op on an up-to-date database. `alembic heads` then asserts the
      # chain is linear -- Ticket #9 branched off the same parent as #20, so a
      # second head is the specific failure this guards against. DATABASE__URL is
      # scoped to this step so it cannot perturb tests that deliberately run
      # without a database.
      - name: Database migrations
        env:
          DATABASE__URL: postgresql://t20@127.0.0.1:5432/t20
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic check
          alembic heads

      - name: Run Tests
        run: |
          pytest

      - name: Dependency audit
        run: |
          pip-audit -r requirements.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
