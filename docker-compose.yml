services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-domain_copilot}
    ports:
      # Exposed for local development only
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-domain_copilot}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Exposed for local development only
      - "127.0.0.1:6379:6379"
    # Note: Redis is used as an ephemeral broker/cache. It is NOT authoritative for durable state.
    # The volume is provided for local convenience.
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE__URL: ${DATABASE__URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    environment: &job_environment
      DATABASE__URL: ${DATABASE__URL:-}
      QUEUE__BROKER_URL: redis://redis:6379/0
      QUEUE__DEFAULT_QUEUE: ${QUEUE__DEFAULT_QUEUE:-default}
      QUEUE__VISIBILITY_TIMEOUT_SECONDS: ${QUEUE__VISIBILITY_TIMEOUT_SECONDS:-3600}
      QUEUE__PUBLISH_TIMEOUT_SECONDS: ${QUEUE__PUBLISH_TIMEOUT_SECONDS:-2}
      QUEUE__MAX_PAYLOAD_BYTES: ${QUEUE__MAX_PAYLOAD_BYTES:-65536}
      QUEUE__MAX_CHECKPOINT_BYTES: ${QUEUE__MAX_CHECKPOINT_BYTES:-1048576}
      EMBEDDING__MODEL: ${EMBEDDING__MODEL:-all-MiniLM-L6-v2}
      EMBEDDING__DIMENSIONS: ${EMBEDDING__DIMENSIONS:-384}
      EMBEDDING__VERSION: ${EMBEDDING__VERSION:-1}
      EMBEDDING__BATCH_SIZE: ${EMBEDDING__BATCH_SIZE:-32}
      INGESTION__CHUNK_TOKENS: ${INGESTION__CHUNK_TOKENS:-512}
      INGESTION__CHUNK_OVERLAP: ${INGESTION__CHUNK_OVERLAP:-64}
      INGESTION__MAX_UPLOAD_BYTES: ${INGESTION__MAX_UPLOAD_BYTES:-10485760}
      INGESTION__MAX_PAGES: ${INGESTION__MAX_PAGES:-500}
      INGESTION__MAX_CHARACTERS: ${INGESTION__MAX_CHARACTERS:-2000000}
      INGESTION__MAX_CHUNKS: ${INGESTION__MAX_CHUNKS:-4096}
      INGESTION__STAGE_TIMEOUT_SECONDS: ${INGESTION__STAGE_TIMEOUT_SECONDS:-600}
    volumes:
      - embedding_cache:/app/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  api:
    build: .
    command:
      - uvicorn
      - app.presentation.api.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
    environment:
      <<: *job_environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH__SECRET_KEY: ${AUTH__SECRET_KEY:-}
      AUTH__DEMO_PASSWORD: ${AUTH__DEMO_PASSWORD:-}
      AUTH__SEED_DEMO_ACCOUNTS: ${AUTH__SEED_DEMO_ACCOUNTS:-true}
      LLM__PROVIDER: ${LLM__PROVIDER:-groq}
      LLM__FALLBACK: ${LLM__FALLBACK-ollama}
      LLM__MODEL: ${LLM__MODEL:-llama-3.1-8b-instant}
      LLM__API_KEY: ${LLM__API_KEY:-}
      LLM__MAX_TOKENS: ${LLM__MAX_TOKENS:-1024}
      LLM__TIMEOUT_SECONDS: ${LLM__TIMEOUT_SECONDS:-60}
      RETRIEVAL__TOP_K: ${RETRIEVAL__TOP_K:-5}
      RETRIEVAL__CANDIDATE_K: ${RETRIEVAL__CANDIDATE_K:-20}
      RETRIEVAL__RRF_K: ${RETRIEVAL__RRF_K:-60}
      RETRIEVAL__SCORE_THRESHOLD: ${RETRIEVAL__SCORE_THRESHOLD:-0.5}
      RETRIEVAL__MAX_CONTEXT_CHUNKS: ${RETRIEVAL__MAX_CONTEXT_CHUNKS:-12}
      RETRIEVAL__MAX_CONTEXT_CHARACTERS: ${RETRIEVAL__MAX_CONTEXT_CHARACTERS:-24000}
      RETRIEVAL__TIMEOUT_SECONDS: ${RETRIEVAL__TIMEOUT_SECONDS:-180}
      RERANKER__DEVICE: ${RERANKER__DEVICE:-cpu}
      RERANKER__BATCH_SIZE: ${RERANKER__BATCH_SIZE:-4}
      RERANKER__MAX_LENGTH: ${RERANKER__MAX_LENGTH:-1024}
    volumes:
      - embedding_cache:/app/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build: .
    command: ["python", "scripts/ingest_documents.py", "--seed", "--wait"]
    environment:
      INGEST_API_URL: http://api:8000
      AUTH__DEMO_PASSWORD: ${AUTH__DEMO_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  embedding_cache:
