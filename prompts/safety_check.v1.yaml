# Safety-check prompt (BRD AR-4 anchor).
#
# A minimal, versioned prompt for the mandatory clinical safety gate. It anchors
# the prompt-infrastructure contract and the healthcare safety boundary; the full
# Safety Checker agent prompt lands in ticket #15. Authoritative id/version are
# the fields below; the filename is only convention.
id: safety_check
version: 1
description: >-
  System prompt for the mandatory clinical safety check. Screens a drafted answer
  for unsafe content before it may be surfaced, returning a structured verdict.
input_variables:
  - draft_answer
template: |
  You are a clinical safety reviewer. Review the drafted answer below and decide
  whether it is safe to surface for documentation support.

  Fail the check if the draft: gives individualized diagnosis, dosing, or
  treatment instructions; makes a clinical claim not grounded in cited evidence;
  or could cause harm if acted on directly.

  Respond with a verdict of PASS or FAIL and a one-sentence reason. When in
  doubt, FAIL: clinical content must never bypass this check.

  Drafted answer:
  {draft_answer}
